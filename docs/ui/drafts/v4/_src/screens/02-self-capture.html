<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .screen { height: 844px; background: #0B0A0D; color: #fff; }
  .header .t { color: #fff; font-size: 17px; }
  .header .icon-btn { color: #fff; }
  .count { justify-self: end; padding-right: 10px; font-size: 15px; font-weight: 400; color: rgba(255,255,255,.72); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .steps { display: flex; gap: 4px; padding: 2px 24px 0; }
  .steps i { flex: 1; height: 2px; border-radius: 1px; background: rgba(255,255,255,.18); }
  .steps i.done { background: rgba(255,255,255,.9); }
  .steps i.now { background: linear-gradient(to right, rgba(255,255,255,.9) 50%, rgba(255,255,255,.18) 50%); }
  .stage { position: relative; margin: 66px 20px 0; }
  .card { height: 430px; border-radius: 18px; overflow: hidden; position: relative; }
  .card img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; }
  .oval { position: absolute; left: 50%; top: 62px; width: 164px; height: 206px; margin-left: -82px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.75); }
  .pose { position: absolute; left: 50%; top: -42px; margin-left: -42px; width: 84px; height: 84px; border-radius: 50%; overflow: hidden; border: 3px solid #0B0A0D; box-shadow: 0 0 0 1.5px rgba(255,255,255,.9); z-index: 2; }
  .pose img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; }
  .cond { margin: 20px auto 0; display: flex; justify-content: center; }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px 0 12px; border-radius: 16px; background: rgba(255,255,255,.08); font-size: 13px; font-weight: 500; color: rgba(255,255,255,.82); }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: #7AD9B4; }
  .chip .sep { width: 1px; height: 10px; background: rgba(255,255,255,.22); }
  .shutter { position: absolute; left: 50%; top: 692px; margin-left: -38px; width: 76px; height: 76px; border-radius: 50%; border: 3px solid #fff; display: grid; place-items: center; }
  .shutter i { width: 62px; height: 62px; border-radius: 50%; background: #fff; }
  .side { position: absolute; top: 653px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.1); display: grid; place-items: center; color: #fff; }
  .side svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .side.l { left: 64px; } .side.r { right: 64px; }
</style></head>
<body><div class="screen">
  <!--@status dark-->
  <div class="header">
    <div class="icon-btn" style="color:#fff"><!--@i x--></div>
    <div class="t">정면을 바라봐 주세요</div>
    <div class="count">2/4</div>
  </div>

  <div class="stage">
    <div class="pose"><img src="photos/g-pose.png" alt=""></div>
    <div class="card"><img src="photos/u-front.png" alt=""><div class="oval"></div></div>
  </div>

  <div class="cond"><span class="chip"><span class="dot"></span>자연광<span class="sep"></span>밝기 적정</span></div>

  <div class="shutter"><i></i></div>
  <!--@home dark-->
</div></body></html>
