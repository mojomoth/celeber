<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .sub { display: flex; justify-content: space-between; align-items: baseline; padding: 6px var(--gutter) 14px; }
  .sub b { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
  .sub b em { font-style: normal; color: var(--muted); font-weight: 500; margin-left: 4px; }
  .sub span { font-size: 13px; color: var(--muted); }
  .lib .tile { height: 300px; }
  .lib .tile img { object-position: 50% 12%; }
  .lib .cta { height: 92px; padding-top: 18px; }
  .lib .cta .go { display: flex; align-items: center; gap: 4px; }
  .lib .cta svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .mine { padding: 10px var(--gutter) 0; }
  .mine .h2 { margin-bottom: 14px; }
  .pc { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 14px 14px 14px 14px; background: var(--paper); border-radius: 16px; }
  .pc img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; object-position: 50% 15%; }
  .pc b { font-size: 16px; font-weight: 700; letter-spacing: -0.03em; }
  .pc .meta { margin-top: 6px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .pc .dots .sw-s { width: 16px; height: 16px; margin-left: -4px; box-shadow: 0 0 0 2px var(--paper); }
  .pc .dots .sw-s:first-child { margin-left: 0; }
  .pc svg, .rrow svg { width: 20px; height: 20px; stroke: var(--faint); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .list { margin-top: 10px; }
  .rrow { display: grid; grid-template-columns: 1fr auto; align-items: center; min-height: 60px; border-bottom: 1px solid var(--line); }
  .rrow b { font-size: 15px; font-weight: 500; letter-spacing: -0.02em; }
  .rrow b small { display: block; margin-top: 3px; font-size: 12.5px; font-weight: 400; color: var(--muted); }
  .rrow.danger b { color: var(--danger); }
  .rrow svg { margin-right: 14px; }
  .pad-nav { height: 140px; }
</style></head>
